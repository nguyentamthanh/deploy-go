services:
  - type: web
    name: deploy-go
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GIN_MODE
        value: release
      - key: DATABASE_URL
        fromDatabase:
          name: deploy-go-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: deploy-go-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: deploy-go-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: deploy-go-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: deploy-go-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: deploy-go-db
          property: database
      - key: DB_SSLMODE
        value: require

  - type: redis
    name: deploy-go-db
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
