services:
  postgres:
    image: postgres:15-alpine
    container_name: deploy-go-postgres
    environment:
      POSTGRES_DB: deploy_go
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: deploy-go-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=deploy_go
      - DB_SSLMODE=disable
      - GIN_MODE=debug
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
